name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package.json
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(p.version!==tag){console.error('tag',tag,'!= package version',p.version); process.exit(1)}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - run: bun install --frozen-lockfile
      - run: bun run check

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## myapi ${{ github.ref_name }}

            独立 AStudio 多账号网关：OpenAI Chat Completions / Responses / Anthropic Messages 三协议，Web 控制台、多账号轮换、用量与权益管理。

            ```bash
            docker pull ghcr.io/zhuchunshu/myapi:${{ github.ref_name }}
            ```

            详见 README 的「快速开始」与「客户端接入」。升级前请备份 `data/`（含账号凭据与主密钥）。
